<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<style>
		body {
			min-width: 320px;
			margin: 0;
			padding: 8px;
			font-size: 13px;
		}

		.memory-row, .draft {
			padding: 4px 0;
			border-bottom: 1px solid #eee;
		}

		.warn {
			color: #a00;
		}

		.muted {
			color: #666;
		}

		#MemoryList {
			max-height: 260px;
			overflow-y: auto;
		}

		#ChatLog {
			font-size: 12px;
		}

		ul {
			margin: 4px 0;
			padding-left: 16px;
		}
	</style>
</head>

<body>
	<div class="d-flex justify-content-between align-items-center mb-1">
		<b>Apply Assistant</b>
		<span id="Mode" class="muted"></span>
	</div>
	<div class="mb-2">
		<label class="mb-1">Mode override:</label>
		<select id="ModeOverride" class="form-select form-select-sm">
			<option value="auto">auto</option>
			<option value="job_detail">job_detail</option>
			<option value="apply_form">apply_form</option>
		</select>
	</div>
	<ul class="nav nav-tabs mb-2">
		<li class="nav-item"><button id="ShowJobs" class="nav-link active">Jobs</button></li>
		<li class="nav-item"><button id="ShowMemory" class="nav-link">Memory</button></li>
	</ul>
	<div id="JobsView" class="mb-2">
		<label class="mb-1 d-block">Job id:
			<input id="JobId" type="text" class="form-control form-control-sm" placeholder="job id or /job/get/ URL" />
		</label>
		<button id="FromPage" class="btn btn-sm btn-outline-secondary">From page</button>
		<button id="LoadJob" class="btn btn-sm btn-outline-secondary">Load</button>
		<div id="JobInfo" class="mt-1"></div>
		<div class="mt-1">
			<button id="OpenJob" class="btn btn-sm btn-outline-secondary">Open</button>
			<button id="MarkApplied" class="btn btn-sm btn-outline-secondary">Applied</button>
			<button id="FillJob" class="btn btn-sm btn-outline-secondary">Fill current form</button>
			<button id="ComposeJob" class="btn btn-sm btn-outline-secondary">Compose</button>
		</div>
		<div id="JobsStatus" class="muted"></div>
	</div>
	<div id="ComposeView" class="mb-2">
		<b>Long-form drafts</b>
		<span id="ComposeStatus" class="muted"></span>
		<div id="ComposeList"></div>
	</div>
	<div id="MemoryView" class="mb-2" style="display:none">
		<button id="RefreshMemory" class="btn btn-sm btn-outline-secondary">Refresh</button>
		<select id="MemoryScope" class="form-select form-select-sm w-auto d-inline-block">
			<option value="">all scopes</option>
			<option value="Apply">apply</option>
			<option value="Resume">resume</option>
			<option value="Ranking">ranking</option>
		</select>
		<div id="MemoryCap" class="warn"></div>
		<div id="MemoryList"></div>
		<hr />
		<b>Add lesson (tip, confirmed)</b>
		<label class="mb-1 mt-1 d-block">Scope: <select id="TipScope" class="form-select form-select-sm"></select></label>
		<label class="mb-1 d-block">Field: <select id="TipRankingKey" class="form-select form-select-sm" style="display:none"></select>
			<input id="TipFieldKey" type="text" class="form-control form-control-sm" placeholder="field key (name or label)" />
		</label>
		<label class="mb-1 d-block">Value: <input id="TipValue" type="text" class="form-control form-control-sm" /></label>
		<label class="mb-1 d-block">Note: <input id="TipNote" type="text" class="form-control form-control-sm" /></label>
		<button id="SaveTip" class="btn btn-sm btn-outline-secondary">Save lesson</button>
		<div id="ChatLog" class="muted"></div>
	</div>
	<script src="../controllers/storage-handler.js"></script>
	<script src="../controllers/background-messaging.js"></script>
	<script src="../controllers/form-inventory.js"></script>
	<script src="compose-ui.js"></script>
	<script src="panel.js"></script>
</body>

</html>
