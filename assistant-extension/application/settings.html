<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<script src="../controllers/storage-handler.js"></script>
	<script src="theme.js"></script>
	<style>
		body {
			width: 360px;
			margin: 0;
			padding: 8px;
			font-size: 13px;
		}

		.warn {
			color: var(--bs-danger);
		}

		.log-error {
			color: var(--bs-danger);
			font-weight: 600;
		}

		.muted {
			color: var(--bs-secondary-color);
		}

		#LogsList {
			max-height: 220px;
			overflow-y: auto;
			font-size: 12px;
		}
	</style>
</head>

<body>
	<b>Apply Assistant — settings</b> <span id="Version" class="muted"></span>
	<p class="muted">Press Enter in each field to save.</p>
	<label class="mb-1 d-block">Core URL: <input id="ServerUrl" type="text" class="form-control form-control-sm" /></label>
	<label class="mb-1 d-block">Assistant API Key: <input id="ApiKey" type="password" class="form-control form-control-sm" /></label>
	<label class="mb-1 d-block">Llama URL: <input id="LlamaUrl" type="text" class="form-control form-control-sm" /></label>
	<label class="mb-1 d-block">Llama Model: <input id="LlamaModel" type="text" class="form-control form-control-sm" /></label>
	<label class="mb-1 d-block">Theme:
		<select id="ThemeMode" class="form-select form-select-sm">
			<option value="system">system</option>
			<option value="light">light</option>
			<option value="dark">dark</option>
		</select>
	</label>
	<button id="OpenPanel" class="btn btn-sm btn-primary mt-2 mb-1">Open Assistant Panel</button>
	<hr />
	<div class="d-flex justify-content-between align-items-center mb-1">
		<b>Logs</b>
		<select id="LogsFilter" class="form-select form-select-sm w-auto">
			<option value="">all levels</option>
			<option value="info">info</option>
			<option value="warn">warn</option>
			<option value="error">error</option>
		</select>
	</div>
	<div class="mb-1">
		<button id="LogsRefresh" class="btn btn-sm btn-outline-secondary">Refresh</button>
		<button id="LogsClear" class="btn btn-sm btn-outline-secondary">Clear</button>
		<button id="LogsDownload" class="btn btn-sm btn-outline-secondary">Download</button>
		<span id="LogsStatus" class="muted"></span>
	</div>
	<div id="LogsList"></div>
	<script src="../controllers/logger.js"></script>
	<script src="settings.js"></script>
</body>

</html>
